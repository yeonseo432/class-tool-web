<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1b2a87; --navy2:#14206b; --blue:#1a73e8; --sky:#0a8ff0; --btn:#1f4b94;
  --bg:#f2f3f8; --card:#fff; --line:#e3e6ef; --text:#222; --sub:#6b7280; --danger:#e5484d; --ok:#16a34a;
  --nav-w:100px; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* ---------- 좌측 내비게이션 ---------- */
#nav{position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);background:var(--navy);display:flex;flex-direction:column;align-items:stretch;z-index:50;padding-top:10px}
.logo{display:flex;flex-direction:column;align-items:center;color:#fff;margin:4px 0 12px}
.logo-mark{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px}
.logo small{font-size:11px;opacity:.8;margin-top:4px;letter-spacing:.5px}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:5px;color:#fff;padding:12px 4px;cursor:pointer;font-size:13px;position:relative;user-select:none}
.nav-item svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.6}
.nav-item:hover,.nav-item.hover{background:rgba(255,255,255,.08)}
.nav-item.active{background:#fff;color:var(--navy)}
.nav-item.active svg{stroke:var(--navy)}
.nav-spacer{flex:1}
#flyout{position:fixed;top:0;bottom:0;left:var(--nav-w);width:330px;background:#fff;z-index:49;box-shadow:6px 0 24px rgba(0,0,0,.12);
  transform:translateX(-110%);transition:transform .22s ease;padding:22px 28px;overflow:auto}
#flyout.open{transform:none}
#flyout h2{margin:0 0 14px;font-size:22px;font-weight:700;padding-bottom:14px;border-bottom:1px solid var(--line)}
.fly-link{display:block;color:var(--blue);font-size:16px;padding:9px 0 2px;cursor:pointer;text-decoration:none}
.fly-link:hover{text-decoration:underline}
.fly-desc{color:var(--sub);font-size:12px;margin-bottom:6px}
.fly-head{font-weight:700;font-size:14px;color:#333;margin:12px 0 2px}
.fly-sep{border-top:1px solid var(--line);margin:14px 0}
.fly-empty{color:#9aa0ac;font-size:13px;padding:6px 0}

#main{margin-left:var(--nav-w);min-height:100vh;padding:24px 28px}
.page-title{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-title h1{font-size:22px;margin:0}
.page-title .grow{flex:1}

/* ---------- 공통 ---------- */
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:13px;color:#333;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:#b9c2d6}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--btn);border-color:var(--btn);color:#fff}
.btn.primary:hover{background:#183d7a}
.btn.danger{color:var(--danger)}
.btn.big{padding:11px 18px;font-size:15px;font-weight:700}
.btn.ghost{border-color:transparent;background:transparent}
.card{background:#fff;border-radius:var(--radius);box-shadow:0 1px 3px rgba(20,30,80,.06)}
.empty{color:#9aa0ac;text-align:center;padding:40px 10px}
.chip{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#3446b5;border-radius:20px;padding:2px 9px;font-size:12px;margin:2px}
.chip.new{background:#fff4e5;color:#b35c00}
.chip button{border:0;background:none;color:inherit;padding:0 0 0 2px;font-size:13px}
label.f{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
.inp{width:100%;border:1px solid #d6dbe7;border-radius:7px;padding:8px 10px;background:#fff}
.inp:focus{outline:2px solid #c7d6ff;border-color:#8fa8ff}
textarea.inp{resize:vertical}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1}

/* ---------- 모달 / 토스트 ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,20,45,.42);z-index:900;display:flex;align-items:center;justify-content:center;animation:fade .15s}
.modal{background:#fff;border-radius:14px;width:min(520px,94vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:pop .18s}
.modal.wide{width:min(720px,94vw)}
.modal-h{padding:18px 22px 6px;font-size:18px;font-weight:700}
.modal-b{padding:6px 22px 14px;overflow:auto}
.modal-f{padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px}
.modal-msg{white-space:pre-line;font-size:15px;line-height:1.6;padding:6px 0}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#1f2433;color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);animation:pop .2s}
.toast.err{background:#b42323}
#busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:1001;background:linear-gradient(90deg,transparent,var(--sky),transparent);background-size:50% 100%;animation:bar 1s linear infinite;display:none}
#busy.on{display:block}
@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}

/* ---------- 로그인 ---------- */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#1b2a87,#0a8ff0);z-index:2000;display:flex;align-items:center;justify-content:center}
.login-box{background:#fff;border-radius:16px;padding:34px 34px 28px;width:min(380px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.login-box h2{margin:10px 0 6px}
.login-box p{color:var(--sub);margin:0 0 18px;font-size:13px;line-height:1.6}
.login-box .inp{font-size:16px;padding:11px 12px;text-align:center}
.login-box .btn{width:100%;justify-content:center;margin-top:12px}
.login-err{color:var(--danger);font-size:13px;min-height:18px;margin-top:8px}

/* ---------- 문제 렌더링 ---------- */
.qv{font-size:15px;line-height:1.65;color:#1d2433}
.qv .qv-title{display:inline-block;font-size:12px;background:#eef2ff;color:#3446b5;border-radius:4px;padding:1px 8px;margin-bottom:8px}
.qv .qv-stem{white-space:pre-wrap;font-weight:500;margin-bottom:10px}
.qv img{max-width:100%;max-height:260px;border-radius:6px;border:1px solid var(--line);display:block;margin:6px 0 10px}
.qv .qv-ch{display:flex;gap:8px;padding:5px 8px;border-radius:6px}
.qv .qv-ch.ans{background:#e9f8ef;color:#126b35;font-weight:700}
.qv .qv-n{flex:none}
.qv .qv-ans{margin-top:10px;font-size:13px;color:#126b35;background:#f1faf4;border-radius:6px;padding:6px 10px}
.qv .qv-exp{margin-top:6px;font-size:13px;color:#4b5563;background:#f7f8fb;border-radius:6px;padding:6px 10px;white-space:pre-wrap}
.qv .qv-mis{font-size:11.5px;color:#b35c00;margin-left:24px;margin-top:-2px}
.qv .qv-con{margin-top:8px}

/* ---------- 문제은행 ---------- */
.bank{display:flex;gap:18px;height:calc(100vh - 48px)}
.explorer{flex:7;position:relative;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;overflow:clip;box-shadow:0 1px 3px rgba(20,30,80,.06)}
.maker{flex:3;min-width:300px;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,80,.06)}
#exMain{display:flex;flex-direction:column;flex:1;min-height:0}
.ex-head{display:flex;align-items:center;gap:10px;padding:16px 20px 10px}
.crumbs{flex:1;font-size:18px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.crumb{padding:3px 8px;border-radius:6px;cursor:pointer}
.crumb:hover{background:#f0f3fa}
.crumb.drop-hot,.fcard.drop-hot{outline:2px dashed var(--blue);background:#eaf2ff}
.crumbs .sep{color:#aab}
.search{width:200px;border:1px solid #d6dbe7;border-radius:20px;padding:7px 14px}
.ex-tools{display:flex;gap:6px;align-items:center;padding:0 20px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ex-tools .selinfo{color:var(--sub);font-size:12px;margin-left:6px}
.ex-tools .div{width:1px;height:20px;background:var(--line);margin:0 4px}
.ex-body{flex:1;overflow:auto;padding:14px 20px 90px}
.sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:6px 0 10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.fcard{position:relative;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;background:#fff;transition:.12s}
.fcard:hover{background:#f6f8fd;border-color:#cfd7ea}
.fcard.sel{background:#e8f0fe;border-color:#8fb1f7}
.fcard svg{width:30px;height:30px;flex:none}
.fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-size:11px;color:var(--sub)}
.ck{position:absolute;top:5px;right:6px;opacity:0}
.fcard:hover .ck,.fcard.sel .ck{opacity:1}
.qlist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;background:#fff}
.qrow:first-child{border-top:0}
.qrow:hover{background:#f6f8fd}
.qrow.sel{background:#e8f0fe}
.qtype{font-size:11px;border-radius:4px;padding:1px 7px;flex:none}
.qtype.mc{background:#e8f0fe;color:#1a56c4}
.qtype.short{background:#fdf0e6;color:#b35c00}
.qtitle{flex:1;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qsub{color:var(--sub);font-size:12px;width:110px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qcon{color:#3446b5;font-size:12px;width:70px}
.qpath{color:#9aa0ac;font-size:11px}
body.lifting [data-drop-folder]{outline:2px dashed #9ab8f5;outline-offset:2px}

/* 문제 창 */
#winLayer{position:absolute;inset:0 0 46px 0;pointer-events:none;z-index:20;overflow:hidden}
.qwin{position:absolute;width:460px;max-width:calc(100% - 20px);max-height:calc(100% - 30px);display:flex;flex-direction:column;background:#fff;border-radius:12px;
  box-shadow:0 18px 50px rgba(20,30,80,.28),0 0 0 1px rgba(20,30,80,.08);pointer-events:auto;transition:transform .35s cubic-bezier(.4,.1,.3,1),opacity .35s}
.qwin.opening{transform:scale(.92) translateY(10px);opacity:0}
.qwin.minimizing{transform:translate(var(--mx,0),var(--my,300px)) scale(.12);opacity:0}
.qwin.lifted{opacity:.55}
.qw-bar{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;background:linear-gradient(#f7f8fc,#eef1f8);border-radius:12px 12px 0 0;border-bottom:1px solid var(--line);cursor:move;user-select:none;touch-action:none}
.qw-title{flex:1;font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.qw-state{font-size:11px;color:#b35c00;background:#fff4e5;border-radius:10px;padding:1px 8px}
.qw-state.ok{color:#126b35;background:#e9f8ef}
.qw-btns button{width:28px;height:26px;border:0;background:transparent;border-radius:6px;font-size:18px;line-height:1;color:#555}
.qw-btns button:hover{background:#dfe4f0}
.qw-btns button[data-w=close]:hover{background:#e5484d;color:#fff}
.qw-body{flex:1;overflow:auto;padding:14px 16px}
.qw-body.view{touch-action:none;cursor:grab;user-select:none}
.qw-hint{margin-top:12px;font-size:12px;color:#7a8195;background:#f5f7fb;border:1px dashed #cfd6e6;border-radius:8px;padding:7px 10px;text-align:center}
.qw-foot{display:flex;gap:6px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.qw-foot .grow{flex:1}
.qw-foot select{max-width:150px;border:1px solid #d6dbe7;border-radius:7px;padding:6px}
.ch-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ch-row .num{width:18px;text-align:center}
.ch-row .inp{padding:6px 8px;flex:1;width:auto;min-width:0}
.ch-row .mis{flex:.85;font-size:12px;background:#fffaf2}
.ch-row button{border:0;background:none;color:#999;font-size:16px}
.img-box{position:relative;display:inline-block;margin:6px 0}
.img-box img{max-width:100%;max-height:180px;border-radius:6px;border:1px solid var(--line)}
.img-box button{position:absolute;top:4px;right:4px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:22px;height:22px}
.lift-ghost{position:fixed;z-index:1500;pointer-events:none;background:#fff;border-radius:10px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.3);
  border:2px solid var(--blue);font-weight:700;font-size:13px;transform:translate(-50%,-120%) rotate(-3deg);max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#taskbar{position:absolute;left:0;right:0;bottom:0;height:46px;background:rgba(240,243,250,.96);border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;z-index:25;overflow-x:auto}
#taskbar .tb-label{font-size:12px;color:#9aa0ac;flex:none}
.tb-chip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #d6dbe7;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer;max-width:200px;animation:pop .25s}
.tb-chip span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-chip:hover{border-color:var(--blue)}

/* 채팅 */
.mk-head{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.mk-head h3{margin:0 0 4px;font-size:17px}
.mk-head p{margin:0;color:var(--sub);font-size:12px;line-height:1.5}
.ai-btn{margin-top:10px;width:100%;border:2px solid #c9d3ea;background:#fff;border-radius:10px;padding:9px;font-weight:700;color:#556;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
.ai-btn.on{background:linear-gradient(135deg,#5b6cff,#0a8ff0);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(40,90,240,.35)}
.ai-btn .sw{font-size:11px;background:rgba(0,0,0,.12);border-radius:10px;padding:1px 8px}
.mk-opts{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:10px 18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}
.mk-opts .inp{padding:5px 8px}
.chat-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#fafbfe}
.bub{max-width:88%;padding:9px 12px;border-radius:12px;line-height:1.55;white-space:pre-wrap;font-size:13.5px}
.bub.me{align-self:flex-end;background:var(--btn);color:#fff;border-bottom-right-radius:3px}
.bub.ai{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.bub.sys{align-self:center;background:#eef2ff;color:#3446b5;font-size:12px;border-radius:20px;padding:5px 12px}
.bub.typing{color:#999}
.chat-input{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.chat-input textarea{flex:1;border:1px solid #d6dbe7;border-radius:10px;padding:9px 10px;resize:none;height:76px}
.chat-input button{width:64px;border:0;border-radius:10px;background:var(--btn);color:#fff;font-weight:700}

/* ---------- 수업하기 ---------- */
.tabs{display:flex;border-bottom:1.5px solid #333;margin:6px 0 24px}
.tab{padding:12px 34px;border:1px solid #d9dce4;border-bottom:0;border-radius:10px 10px 0 0;margin-right:-1px;color:#1f3c88;font-weight:700;font-size:16px;cursor:pointer;background:#fff}
.tab.on{background:#1f4b94;color:#fff;border-color:#1f4b94}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px}
.ccard{background:#fff;border:1.5px solid #1a73e8;border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.cc-head{height:150px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;color:#fff}
.cc-head svg{width:110px;height:100px;stroke:#fff;fill:none;stroke-width:2.2;flex:none}
.cc-subj{font-size:38px;font-weight:900;line-height:1.2;text-align:right;word-break:keep-all;min-width:0;margin-left:12px}
.cc-body{padding:22px 30px 28px;display:flex;flex-direction:column;gap:8px;flex:1}
.badges{display:flex;gap:6px}
.b-st{background:#1f3c88;color:#fff;font-weight:700;font-size:13px;padding:2px 7px;border-radius:2px}
.b-st.ready{background:#6b7a99}
.b-st.ended{background:#9aa0ac}
.b-sem{border:1px solid #1a73e8;color:#1a73e8;font-size:13px;padding:1px 7px;border-radius:2px}
.cc-name{font-size:20px;font-weight:700;margin-top:6px}
.cc-next{font-size:13px;color:var(--sub)}
.cc-intro{color:#555;font-weight:700;margin-top:10px;display:flex;align-items:center;gap:6px}
.cc-sched{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;color:#555}
.cc-sched span{min-width:0}
.cc-sched a{font-weight:700;text-decoration:underline;color:#222;cursor:pointer;white-space:nowrap;flex:none}
.cc-go{margin-top:10px;background:#1f4b94;color:#fff;border:0;border-radius:3px;padding:14px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.cc-go:hover{background:#183d7a}
.ltable{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
.ltable th{background:#f5f7fb;color:#555;font-weight:700;font-size:13px;padding:10px;text-align:left;border-bottom:1px solid var(--line)}
.ltable td{padding:10px;border-bottom:1px solid var(--line)}
.ltable tr.lrow{cursor:pointer}
.ltable tr.lrow:hover td{background:#f7f9ff}
.ltable tr.past td{color:#9aa0ac}
.ltable tr.today td{background:#fffbe8}
.pill{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;background:#eef2ff;color:#3446b5}
.pill.gray{background:#f0f1f4;color:#888}
.pill.ok{background:#e9f8ef;color:#126b35}
.btn.start{background:#e5484d;border-color:#e5484d;color:#fff;font-weight:700}
.btn.start:hover{background:#c93439}
.sched-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.sched-row select,.sched-row input{border:1px solid #d6dbe7;border-radius:7px;padding:7px}
.preview-note{background:#f1f6ff;color:#1f4b94;border-radius:8px;padding:9px 12px;margin-top:12px;font-size:13px}
.sc-group{margin-bottom:18px}
.sc-date{font-weight:700;margin:4px 0 8px;color:#333}
.sc-item{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:8px;box-shadow:0 1px 3px rgba(20,30,80,.06)}
.sc-item .t{flex:1}
.sc-item .t b{font-size:15px}

/* 차시 상세 */
.lesson-split{display:flex;gap:18px;height:calc(100vh - 130px)}
.ls-left,.ls-right{background:#fff;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(20,30,80,.06)}
.ls-left{flex:1.1}
.ls-right{flex:.9}
.ls-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:700}
.ls-h .grow{flex:1}
.ls-drop{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
.ls-drop.hot{background:#f1f6ff;outline:2px dashed #8fb1f7;outline-offset:-8px}
.lq{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;height:230px;overflow:hidden;box-shadow:0 2px 6px rgba(20,30,80,.06);cursor:grab}
.lq .lq-no{position:absolute;left:8px;top:8px;z-index:2;background:var(--navy);color:#fff;border-radius:6px;font-size:12px;font-weight:700;padding:1px 8px}
.lq .lq-del{position:absolute;right:6px;top:6px;z-index:2;width:28px;height:28px;border:0;border-radius:7px;background:rgba(255,255,255,.9);box-shadow:0 1px 4px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center}

<body>
<nav id="nav"></nav>
<div id="flyout"></div>
<main id="main"></main>
<div id="modalRoot"></div>
<div id="toast"></div>
<div id="busy"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<datalist id="subjList"></datalist>

<div id="login" class="login hidden">
  <div class="login-box">
    <div class="logo-mark" style="margin:0 auto;background:#1b2a87;color:#fff">Q</div>
    <h2>수업 도구</h2>
    <p id="loginMsg">교사 비밀번호를 입력하세요.</p>
    <input id="loginPw" class="inp" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button id="loginBtn" class="btn primary big">들어가기</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<script>
const APP_URL_TPL = <?!= JSON.stringify(appUrl) ?>;
/* ===================== 기본 ===================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const DAYS = ['일','월','화','수','목','금','토'];
const CIRC = ['①','②','③','④','⑤','⑥','⑦','⑧'];
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
let TOKEN = store.get('qc_token') || '';
const S = {
  view:'bank', params:{}, folders:[], questions:[], classes:[], semesters:[], holidays:[], concepts:[], settings:{}, today:'', appUrl:'',
  cwd:'', search:'', sel:{f:new Set(), q:new Set()}, wins:new Map(), chat:[], chatLog:null, aiOn:true, mkSubject:'',
  classTab:'active'
};

let busyN = 0;
function busy(d){ busyN = Math.max(0, busyN + d); $('#busy').classList.toggle('on', busyN > 0); }
function rpc(fn, args){
  return new Promise((res, rej) => {
    const r = google.script.run.withSuccessHandler(res).withFailureHandler(rej);
    r[fn].apply(r, args || []);
  });
}
async function call(fn, ...args){
  busy(1);
  try {
    const r = await rpc('api', [TOKEN, fn, args]);
    return r ? JSON.parse(r) : r;
  } catch (e) {
    const m = (e && e.message) || String(e);
    if (m.indexOf('AUTH') >= 0) { showLogin(); }
    else toast(m.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, ''), true);
    throw e;
  } finally { busy(-1); }
}
function toast(msg, err){
  const t = document.createElement('div');
  t.className = 'toast' + (err ? ' err' : '');
  t.textContent = msg;
  $('#toast').appendChild(t);
  setTimeout(() => t.remove(), err ? 4200 : 2600);
}
function modal({title, body, buttons, wide, onOpen}){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal ${wide ? 'wide' : ''}"><div class="modal-h">${esc(title || '')}</div><div class="modal-b">${body || ''}</div><div class="modal-f"></div></div>`;
  const f = $('.modal-f', bg);
  const close = () => bg.remove();
  (buttons || [{label:'닫기'}]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || (b.primary ? 'primary' : ''));
    el.textContent = b.label;
    el.onclick = async () => {
      if (bg.dataset.busy) return;
      if (b.onClick) {
        bg.dataset.busy = 1; $$('.modal-f button', bg).forEach(x => x.disabled = true);
        let r;
        try { r = await b.onClick(bg); } catch(e){ r = false; }
        delete bg.dataset.busy; $$('.modal-f button', bg).forEach(x => x.disabled = false);
        if (r === false) return;
      }
      close();
    };
    f.appendChild(el);
  });
  bg.addEventListener('mousedown', e => { if (e.target === bg) bg.dataset.down = 1; });
  bg.addEventListener('click', e => { if (e.target === bg && bg.dataset.down) close(); });
  $('#modalRoot').appendChild(bg);
  if (onOpen) onOpen(bg);
  const first = $('input,textarea,select', $('.modal-b', bg));
  if (first) setTimeout(() => first.focus(), 30);
  return {el: bg, close};
}
function confirmBox(msg, okLabel, danger){
  return new Promise(res => {
    modal({title:'확인', body:`<div class="modal-msg">${esc(msg)}</div>`, buttons:[
      {label:'취소', onClick:() => res(false)},
      {label:okLabel || '확인', cls: danger ? 'primary start' : 'primary', onClick:() => res(true)}
    ]});
  });
}
function promptBox(title, value, placeholder){
  return new Promise(res => {
    let done = false;
    const m = modal({title, body:`<input class="inp" id="pbIn" value="${esc(value || '')}" placeholder="${esc(placeholder || '')}">`, buttons:[
      {label:'취소', onClick:() => { done = true; res(null); }},
      {label:'확인', primary:true, onClick:(bg) => { done = true; res($('#pbIn', bg).value.trim()); }}
    ]});
    $('#pbIn', m.el).addEventListener('keydown', e => { if (e.key === 'Enter') { done = true; res(e.target.value.trim()); m.close(); } });
  });
}
function fmtDate(ds){ if (!ds) return ''; const d = new Date(ds + 'T00:00:00'); return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`; }
function pctStr(r){ return r == null ? '-' : Math.round(r * 100) + '%'; }
function appUrl(){ return S.appUrl || APP_URL_TPL || ''; }
function studentUrl(){ return appUrl() + '?page=student'; }

/* ===================== 아이콘 ===================== */
const IC = {
  bank:'<svg viewBox="0 0 24 24"><path d="M4 4h11l5 5v11H4z"/><path d="M15 4v5h5M8 13h8M8 17h5"/></svg>',
  class:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4M10 8l4 2-4 2z"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="2.2"/><circle cx="12" cy="7" r="2.2"/><circle cx="18" cy="15" r="2.2"/><path d="M7.4 15.3l3.3-6.4M13.8 8.4l3 5"/></svg>',
  student:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M10 18h4"/></svg>',
  settings:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>',
  folder:'<svg viewBox="0 0 24 24"><path d="M2 6.5A1.5 1.5 0 013.5 5H9l2 2.2h9.5A1.5 1.5 0 0122 8.7v9.8a1.5 1.5 0 01-1.5 1.5h-17A1.5 1.5 0 012 18.5z" fill="#ffc94d" stroke="#e0a520" stroke-width="1"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/></svg>',
  play:'<svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg>',
  info:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#555" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5v.5"/></svg>'
};
const SUBJ_ICON = {
  math:'<svg viewBox="0 0 120 100"><path d="M18 18v66h78z"/><path d="M8 22v62M4 26l4-6 4 6M4 80l4 6 4-6" stroke-dasharray="5 5"/><path d="M22 92h70" stroke-dasharray="5 5"/><path d="M30 10l70 66" stroke-dasharray="5 5"/><path d="M18 70a14 14 0 0114 14" stroke-dasharray="2 3"/></svg>',
  phys:'<svg viewBox="0 0 120 100"><ellipse cx="60" cy="50" rx="44" ry="16"/><ellipse cx="60" cy="50" rx="44" ry="16" transform="rotate(60 60 50)"/><ellipse cx="60" cy="50" rx="44" ry="16" transform="rotate(-60 60 50)"/><circle cx="60" cy="50" r="6" fill="#fff"/></svg>',
  chem:'<svg viewBox="0 0 120 100"><path d="M48 10h24M52 10v28L28 86h64L68 38V10"/><path d="M36 70h48"/><circle cx="56" cy="78" r="3"/><circle cx="68" cy="74" r="2"/></svg>',
  bio:'<svg viewBox="0 0 120 100"><path d="M40 10c40 20 0 60 40 80M80 10c-40 20 0 60-40 80"/><path d="M46 22h28M44 38h32M44 62h32M46 78h28"/></svg>',
  earth:'<svg viewBox="0 0 120 100"><circle cx="60" cy="50" r="38"/><path d="M22 50h76M60 12c-16 20-16 56 0 76M60 12c16 20 16 56 0 76"/></svg>',
  book:'<svg viewBox="0 0 120 100"><path d="M60 20c-14-8-30-8-44-4v66c14-4 30-4 44 4 14-8 30-8 44-4V16c-14-4-30-4-44 4zM60 20v66"/></svg>'
};
function subjStyle(s){
  s = s || '';
  const T = [['수학','#0a8ff0','math'],['물리','#3d5afe','phys'],['화학','#00a37a','chem'],['생명','#2e9d4a','bio'],['생물','#2e9d4a','bio'],
    ['지구','#0b7fa8','earth'],['과학','#5a4fcf','phys'],['에너지','#3d5afe','phys'],['영어','#e8710a','book'],['국어','#d93a5e','book']];
  const hit = T.find(t => s.indexOf(t[0]) >= 0);
  return hit ? {color:hit[1], icon:SUBJ_ICON[hit[2]]} : {color:'#0a8ff0', icon:SUBJ_ICON.book};
}
function subjTitle(s, base){
  s = String(s || '');
  const n = s.replace(/\s/g, '').length;
  const size = n <= 3 ? base : n <= 5 ? Math.round(base * .82) : n <= 7 ? Math.round(base * .68) : Math.round(base * .58);
  let html = esc(s);
  if (n >= 8 && s.trim().indexOf(' ') > 0) {
    const w = s.trim().split(/\s+/), half = s.length / 2;
    let a = '', b = '';
    w.forEach(x => { if (!b && (!a || (a + ' ' + x).length <= half + 2)) a = (a + ' ' + x).trim(); else b = (b + ' ' + x).trim(); });
    html = esc(a) + (b ? '<br>' + esc(b) : '');
  }
  return '<span class="cc-subj" style="font-size:' + size + 'px">' + html + '</span>';
}

/* ===================== 문제 렌더링 ===================== */
function imgTag(url){
  if (!url) return '';
  return `<img src="${esc(url)}" onerror="if(!this.dataset.r){this.dataset.r=1;this.src=this.src.replace('drive.google.com/thumbnail?id=','lh3.googleusercontent.com/d/').replace(/&sz=.*/,'');}">`;
}
function conceptName(id){ const c = S.concepts.find(x => x.id === id); return c ? c.name : null; }
function renderQ(q, opt){
  opt = opt || {};
  let h = `<div class="qv">`;
  if (q.title && !opt.noTitle) h += `<div class="qv-title">${esc(q.title)}</div>`;
  h += `<div class="qv-stem">${esc(q.stem || '(문항 내용 없음)')}</div>`;
  h += imgTag(q.imageUrl);
  if (q.type === 'mc') {
    (q.choices || []).forEach((c, i) => {
      const ans = opt.answer && String(q.answer) === String(i + 1);
      h += `<div class="qv-ch ${ans ? 'ans' : ''}"><span class="qv-n">${CIRC[i] || (i+1)+'.'}</span><span>${esc(c)}</span></div>`;
      if (opt.mis && !ans && q.misconceptions && q.misconceptions[i]) h += `<div class="qv-mis">오개념: ${esc(q.misconceptions[i])}</div>`;
    });
  }
  if (opt.answer) {
    const a = q.type === 'mc' ? (q.answer ? CIRC[Number(q.answer) - 1] || q.answer : '미지정') : (q.answer || '미지정').split('|').join(' / ');
    h += `<div class="qv-ans">정답: ${esc(a)}</div>`;
    if (q.explanation) h += `<div class="qv-exp">${esc(q.explanation)}</div>`;
  }
  if (opt.concepts) {
    const names = (q.conceptIds || []).map(conceptName).filter(Boolean);
    const nn = q.newConcepts || [];
    if (names.length || nn.length) h += `<div class="qv-con">${names.map(n => `<span class="chip">${esc(n)}</span>`).join('')}${nn.map(n => `<span class="chip new">+ ${esc(n)}</span>`).join('')}</div>`;
  }
  return h + '</div>';
}

/* ===================== 로그인 ===================== */
async function showLogin(){
  $('#login').classList.remove('hidden');
  let st = {hasPassword:true};
  try { st = JSON.parse(await rpc('authStatus')); } catch(e){}
  $('#loginMsg').innerHTML = st.hasPassword ? '교사 비밀번호를 입력하세요.' : '처음 사용하시네요!<br>앞으로 사용할 <b>교사 비밀번호</b>를 만들어 주세요. (4자 이상)';
  $('#loginBtn').textContent = st.hasPassword ? '들어가기' : '비밀번호 만들고 시작하기';
  $('#loginPw').focus();
}
async function doLogin(){
  const pw = $('#loginPw').value;
  $('#loginErr').textContent = '';
  try {
    TOKEN = await rpc('login', [pw]);
    store.set('qc_token', TOKEN);
    $('#login').classList.add('hidden');
    $('#loginPw').value = '';
    await loadAll();
    renderNav(); go(S.view, S.params);
  } catch(e) { $('#loginErr').textContent = ((e && e.message) || String(e)).replace(/^Error:\s*/, ''); }
}
$('#loginBtn').onclick = doLogin;
$('#loginPw').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function loadAll(){
  const b = await call('bootstrap');
  Object.assign(S, b);
  if (S.chatLog === null) {
    S.chatLog = [{who:'ai', text:'안녕하세요! 어떤 문제를 만들어 드릴까요?\n예) "중2 과학, 역학적 에너지 보존 개념을 확인하는 5지선다 문제 하나 만들어줘"'}];
    if (!S.settings.hasKey) S.chatLog.push({who:'sys', text:'OpenAI API 키가 아직 없어요. [설정]에서 입력하면 AI 기능을 쓸 수 있어요.'});
  }
  updateSubjList();
}
function allSubjects(){
  const set = new Set();
  S.classes.forEach(c => c.subject && set.add(c.subject));
  S.concepts.forEach(c => c.subject && set.add(c.subject));
  S.questions.forEach(q => q.subject && set.add(q.subject));
  return Array.from(set).sort();
}
function activeSubjects(){
  const set = new Set();
  S.classes.filter(c => c.status !== 'ended').forEach(c => c.subject && set.add(c.subject));
  return Array.from(set).sort();
}
function updateSubjList(){ $('#subjList').innerHTML = allSubjects().map(s => `<option value="${esc(s)}">`).join(''); }

/* ===================== 내비게이션 ===================== */
const NAV = [
  {key:'bank', label:'문제은행', icon:IC.bank, title:'문제은행', sub:() => [

  {key:'student', label:'학생화면', icon:IC.student, action:() => window.open(studentUrl(), '_blank')},

let flyTimer = null, flyKey = null, flySuppress = false;
function renderNav(){
  const nav = $('#nav');
  const item = n => `<div class="nav-item ${navActive(n.key) ? 'active' : ''}" data-key="${n.key}">${n.icon}<span>${n.label}</span></div>`;
  nav.innerHTML = `<div class="logo"><div class="logo-mark">Q</div><small>수업도구</small></div>` +
    NAV.map(item).join('') + '<div class="nav-spacer"></div>' + NAV_BOTTOM.map(item).join('') + '<div style="height:12px"></div>';
  $$('.nav-item', nav).forEach(el => {
    const key = el.dataset.key;
    const n = NAV.find(x => x.key === key);
    el.addEventListener('mouseenter', () => { if (flySuppress) return; if (n) openFly(n, el); else closeFly(0); });
    el.addEventListener('mouseleave', () => { flySuppress = false; closeFly(250); });
    el.addEventListener('click', () => {
      if (key === 'stats') go('stats', {});
      else if (n) n.sub().find(s => s.go).go();
      else NAV_BOTTOM.find(x => x.key === key).action();
      closeFly(0);
      flySuppress = true;
    });
  });
  nav.onmouseleave = () => { flySuppress = false; };
}
function navActive(k){
  if (k === 'bank') return S.view === 'bank';
  if (k === 'classes') return ['classes', 'classLessons', 'lesson'].includes(S.view);
  if (k === 'stats') return ['stats', 'exam', 'analysis', 'miscon'].includes(S.view);
  return S.view === k;
}
function openFly(n, el){
  clearTimeout(flyTimer);
  flyKey = n.key;
  $$('.nav-item').forEach(x => x.classList.toggle('hover', x === el));
  const f = $('#flyout');
  f.innerHTML = `<h2>${esc(n.title)}</h2>` + n.sub().map((s, i) => {
    if (s.sep) return '<div class="fly-sep"></div>';
    if (s.head) return `<div class="fly-head">${esc(s.head)}</div>`;
    if (s.empty) return `<div class="fly-empty">${esc(s.empty)}</div>`;
    return `<a class="fly-link" data-i="${i}">${esc(s.label)}</a><div class="fly-desc">${esc(s.desc || '')}</div>`;
  }).join('');
  const subs = n.sub();
  $$('.fly-link', f).forEach(a => a.onclick = () => { subs[a.dataset.i].go(); closeFly(0); });
  f.classList.add('open');
}
function closeFly(ms){
  clearTimeout(flyTimer);
  flyTimer = setTimeout(() => { $('#flyout').classList.remove('open'); $$('.nav-item').forEach(x => x.classList.remove('hover')); flyKey = null; }, ms);
}
$('#flyout').addEventListener('mouseenter', () => clearTimeout(flyTimer));
$('#flyout').addEventListener('mouseleave', () => closeFly(200));

function go(view, params){
  S.view = view; S.params = params || {};
  if (view !== 'stats') stopStats();
  $$('.nav-item').forEach(x => x.classList.toggle('active', navActive(x.dataset.key)));
  const main = $('#main');
  main.innerHTML = '';
  ({bank:renderBank, classes:renderClasses, classLessons:renderClassLessons, lesson:renderLesson,
    stats:renderStats, exam:() => renderExam(), analysis:() => renderAnalysis(), miscon:() => renderMiscon(), settings:renderSettings}[view] || renderBank)();
  window.scrollTo(0, 0);
}

function renderBank(){
  $('#main').innerHTML = `<div class="bank">
    <section class="explorer" id="explorer"><div id="exMain"></div><div id="winLayer"></div>
      <div id="taskbar"><span class="tb-label">최소화된 문제</span></div></section>
    <section class="maker" id="maker"></section></div>`;
  bindExplorer();
  renderExplorer();
  renderMaker();
  // 열려 있던 문제 창 다시 붙이기
  for (const w of S.wins.values()) { $('#winLayer').appendChild(w.el); fitWin(w); }
  renderTaskbar();
}
function folderPath(id){
  const out = [];
  let cur = S.folders.find(f => f.id === id);
  let guard = 0;
  while (cur && guard++ < 50) { out.unshift(cur); cur = S.folders.find(f => f.id === cur.parentId); }
  return out;
}
function folderName(id){ if (!id) return '내 문제은행'; const f = S.folders.find(x => x.id === id); return f ? f.name : '내 문제은행'; }
function countIn(fid){
  return {q:S.questions.filter(q => (q.folderId || '') === fid).length, f:S.folders.filter(f => (f.parentId || '') === fid).length};
}
function renderExplorer(){
  if (S.cwd && !S.folders.find(f => f.id === S.cwd)) S.cwd = '';
  const crumbs = [{id:'', name:'내 문제은행'}].concat(folderPath(S.cwd));
  const kw = S.search.trim().toLowerCase();
  const folders = kw ? [] : S.folders.filter(f => (f.parentId || '') === S.cwd).sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const qs = (kw ? S.questions.filter(q => (q.title + ' ' + q.stem + ' ' + q.subject).toLowerCase().includes(kw))
    : S.questions.filter(q => (q.folderId || '') === S.cwd)).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const nSel = S.sel.f.size + S.sel.q.size;
  $('#exMain').innerHTML = `
    <div class="ex-head">
      <div class="crumbs">${crumbs.map(c => `<span class="crumb" data-open="${c.id}" data-drop-folder="${c.id}">${esc(c.name)}</span>`).join('<span class="sep">›</span>')}</div>
      <input class="search" id="exSearch" placeholder="문제 검색" value="${esc(S.search)}">
    </div>
    <div class="ex-tools">
      <button class="btn primary" data-act="newFolder">+ 새 폴더</button>
      <button class="btn" data-act="newQ">+ 빈 문제</button>
      <span class="div"></span>
      <button class="btn" data-act="rename" ${S.sel.f.size === 1 && S.sel.q.size === 0 ? '' : 'disabled'}>이름 변경</button>
      <button class="btn" data-act="move" ${nSel ? '' : 'disabled'}>이동</button>
      <button class="btn" data-act="copy" ${nSel ? '' : 'disabled'}>복제</button>
      <button class="btn danger" data-act="del" ${nSel ? '' : 'disabled'}>삭제</button>
      <span class="selinfo">${nSel ? nSel + '개 선택됨 · ' : ''}폴더를 클릭하면 열리고, 문제를 폴더로 끌어 옮길 수 있어요</span>
    </div>
    <div class="ex-body">
      ${kw ? `<div class="sec-title">'${esc(S.search)}' 검색 결과</div>` : `<div class="sec-title">폴더</div>
      <div class="fgrid">${folders.length ? folders.map(f => { const c = countIn(f.id); return `
        <div class="fcard ${S.sel.f.has(f.id) ? 'sel' : ''}" draggable="true" data-fid="${f.id}" data-drop-folder="${f.id}">
          <input type="checkbox" class="ck" data-ckf="${f.id}" ${S.sel.f.has(f.id) ? 'checked' : ''}>
          ${IC.folder}<div style="min-width:0"><div class="fname">${esc(f.name)}</div><div class="fmeta">문제 ${c.q} · 폴더 ${c.f}</div></div>
        </div>`; }).join('') : '<div style="color:#9aa0ac;font-size:13px">폴더가 없어요. [+ 새 폴더]로 만들어 보세요.</div>'}</div>`}
      <div class="sec-title">문제 <small>${qs.length}</small></div>
      ${qs.length ? `<div class="qlist">${qs.map(q => `
        <div class="qrow ${S.sel.q.has(q.id) ? 'sel' : ''}" draggable="true" data-qid="${q.id}">
          <input type="checkbox" data-ckq="${q.id}" ${S.sel.q.has(q.id) ? 'checked' : ''}>
          <span class="qtype ${q.type}">${q.type === 'mc' ? '객관식' : '단답형'}</span>
          <span class="qtitle">${esc(q.title)}${kw ? ` <span class="qpath">· ${esc(folderName(q.folderId))}</span>` : ''}</span>
          <span class="qsub">${esc(q.subject || '')}</span>
          <span class="qcon">${(q.conceptIds || []).length ? '개념 ' + q.conceptIds.length : ''}</span>
        </div>`).join('')}</div>` : '<div class="empty">이 폴더에 문제가 없어요.<br>오른쪽에서 문제를 만들고, 문제 창을 꾹 눌러 폴더로 끌어다 놓으세요.</div>'}
    </div>`;

function bindExplorer(){
  const ex = $('#exMain');
  ex.addEventListener('click', async e => {
    const t = e.target;
    if (t.matches('input[type=checkbox]')) return;
    const act = t.closest('[data-act]');
    if (act && !act.disabled) return bankAction(act.dataset.act);
    const crumb = t.closest('.crumb');
    if (crumb) { S.cwd = crumb.dataset.open; S.sel.f.clear(); S.sel.q.clear(); S.search = ''; return renderExplorer(); }
    const fc = t.closest('.fcard');
    if (fc) { S.cwd = fc.dataset.fid; S.sel.f.clear(); S.sel.q.clear(); return renderExplorer(); }
    const qr = t.closest('.qrow');
    if (qr) { const q = S.questions.find(x => x.id === qr.dataset.qid); if (q) openQWin(q); }
  });
  ex.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset.ckf) { t.checked ? S.sel.f.add(t.dataset.ckf) : S.sel.f.delete(t.dataset.ckf); renderExplorer(); }
    if (t.dataset.ckq) { t.checked ? S.sel.q.add(t.dataset.ckq) : S.sel.q.delete(t.dataset.ckq); renderExplorer(); }
  });
  ex.addEventListener('input', e => {
    if (e.target.id === 'exSearch') {
      S.search = e.target.value;
      clearTimeout(ex._st);
      ex._st = setTimeout(() => { renderExplorer(); const s = $('#exSearch'); s.focus(); s.setSelectionRange(s.value.length, s.value.length); }, 250);
    }
  });
  ex.addEventListener('dragstart', e => {
    const fc = e.target.closest('.fcard'), qr = e.target.closest('.qrow');
    let sel;
    if (fc) sel = S.sel.f.has(fc.dataset.fid) ? {folderIds:[...S.sel.f], questionIds:[...S.sel.q]} : {folderIds:[fc.dataset.fid], questionIds:[]};
    else if (qr) sel = S.sel.q.has(qr.dataset.qid) ? {folderIds:[...S.sel.f], questionIds:[...S.sel.q]} : {folderIds:[], questionIds:[qr.dataset.qid]};
    if (!sel) return;
    e.dataTransfer.setData('text/plain', 'bank:' + JSON.stringify(sel));
    e.dataTransfer.effectAllowed = 'move';
  });
  ex.addEventListener('dragover', e => {
    const d = e.target.closest('[data-drop-folder]');
    if (!d) return;
    e.preventDefault();
    $$('.drop-hot', ex).forEach(x => x !== d && x.classList.remove('drop-hot'));
    d.classList.add('drop-hot');
  });
  ex.addEventListener('dragleave', e => { const d = e.target.closest('[data-drop-folder]'); if (d && !d.contains(e.relatedTarget)) d.classList.remove('drop-hot'); });
  ex.addEventListener('drop', async e => {
    const d = e.target.closest('[data-drop-folder]');
    $$('.drop-hot', ex).forEach(x => x.classList.remove('drop-hot'));
    if (!d) return;
    e.preventDefault();
    const raw = e.dataTransfer.getData('text/plain');
    if (!raw.startsWith('bank:')) return;
    const sel = JSON.parse(raw.slice(5));
    const target = d.dataset.dropFolder;
    if (sel.folderIds.includes(target)) return;
    const r = await call('moveItems', sel, target);
    applyBank(r); S.sel.f.clear(); S.sel.q.clear(); renderExplorer();
    toast(`'${folderName(target)}'(으)로 옮겼어요`);
  });
}
function applyBank(b){ S.folders = b.folders; S.questions = b.questions; }
async function bankAction(a){
  const sel = {folderIds:[...S.sel.f], questionIds:[...S.sel.q]};
  if (a === 'newFolder') {
    const name = await promptBox('새 폴더', '', '폴더 이름');
    if (!name) return;
    applyBank(await call('createFolder', name, S.cwd)); renderExplorer();
  } else if (a === 'newQ') {
    openQWin({id:'', title:'', subject:S.mkSubject || '', type:'mc', stem:'', choices:['', '', '', ''], answer:'', explanation:'', imageUrl:'', conceptIds:[], misconceptions:[]}, {mode:'edit'});
  } else if (a === 'rename') {
    const id = sel.folderIds[0];
    const name = await promptBox('폴더 이름 변경', folderName(id));
    if (!name) return;
    applyBank(await call('renameFolder', id, name)); renderExplorer();
  } else if (a === 'del') {
    const ok = await confirmBox(`선택한 ${sel.folderIds.length ? '폴더 ' + sel.folderIds.length + '개(안의 문제 포함) ' : ''}${sel.questionIds.length ? '문제 ' + sel.questionIds.length + '개' : ''}를 삭제할까요?\n삭제하면 되돌릴 수 없어요.`, '삭제', true);
    if (!ok) return;
    applyBank(await call('deleteItems', sel)); S.sel.f.clear(); S.sel.q.clear(); renderExplorer(); toast('삭제했어요');
  } else if (a === 'copy') {
    applyBank(await call('copyItems', sel, null)); S.sel.f.clear(); S.sel.q.clear(); renderExplorer(); toast('복제했어요');
  } else if (a === 'move') {
    const target = await pickFolder('이동할 폴더 선택', sel.folderIds);
    if (target === null) return;
    applyBank(await call('moveItems', sel, target)); S.sel.f.clear(); S.sel.q.clear(); renderExplorer(); toast(`'${folderName(target)}'(으)로 옮겼어요`);
  }
}
function folderTreeHtml(parent, depth, banned){
  return S.folders.filter(f => (f.parentId || '') === parent && !banned.includes(f.id)).sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(f =>
    `<label style="display:block;padding:6px 0 6px ${12 + depth * 20}px;cursor:pointer"><input type="radio" name="pf" value="${f.id}"> ${esc(f.name)}</label>` +
    folderTreeHtml(f.id, depth + 1, banned)).join('');
}
function pickFolder(title, banned){
  return new Promise(res => {
    modal({title, body:`<div style="max-height:50vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px">
      <label style="display:block;padding:6px 12px;cursor:pointer;font-weight:700"><input type="radio" name="pf" value="" checked> 내 문제은행 (최상위)</label>
      ${folderTreeHtml('', 1, banned || [])}</div>`, buttons:[
      {label:'취소', onClick:() => res(null)},
      {label:'여기로 이동', primary:true, onClick:bg => res($('input[name=pf]:checked', bg).value)}
    ]});
  });
}

/* ---------- 문제 창 (팝업 · 최소화 · 꾹 눌러 끌기) ---------- */
let winSeq = 0, zTop = 30;
function openQWin(q, opt){
  opt = opt || {};
  for (const w of S.wins.values()) if (q.id && w.q.id === q.id) { if (w.min) restoreWin(w); focusWin(w); return w; }
  const layer = $('#winLayer');
  if (!layer) return null;
  const w = {id:'w' + (++winSeq), q:clone(q), mode:opt.mode || 'view', dirty:!q.id, saved:!!q.id, min:false, folderId:q.id ? (q.folderId || '') : S.cwd};
  if (!w.q.misconceptions) w.q.misconceptions = [];
  if (!w.q.conceptIds) w.q.conceptIds = [];
  if (!w.q.newConcepts) w.q.newConcepts = [];
  const el = document.createElement('div');
  el.className = 'qwin opening';
  const n = [...S.wins.values()].filter(x => !x.min).length;
  el.style.left = (30 + (n % 6) * 28) + 'px';
  el.style.top = (24 + (n % 6) * 24) + 'px';
  w.el = el;
  S.wins.set(w.id, w);
  layer.appendChild(el);
  drawWin(w);
  focusWin(w);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('opening')));
  return w;
}
function focusWin(w){ w.el.style.zIndex = ++zTop; }
function folderOptions(sel){
  const opts = [`<option value="">내 문제은행</option>`];
  const walk = (p, d) => S.folders.filter(f => (f.parentId || '') === p).sort((a, b) => a.name.localeCompare(b.name, 'ko')).forEach(f => {
    opts.push(`<option value="${f.id}" ${f.id === sel ? 'selected' : ''}>${'  '.repeat(d)}${esc(f.name)}</option>`); walk(f.id, d + 1);
  });
  walk('', 1);
  return opts.join('');
}
function setWinState(w){
  const st = $('.qw-state', w.el);
  if (!st) return;
  const ok = w.saved && !w.dirty;
  st.className = 'qw-state' + (ok ? ' ok' : '');
  st.textContent = ok ? '저장됨' : '저장 안 됨';
  $('.qw-title', w.el).textContent = w.q.title || '새 문제';
}
function drawWin(w){
  const q = w.q;
  const el = w.el;

    body = `<div class="qw-body view">${renderQ(q, {answer:true, mis:true, concepts:true})}

    const subjNodes = S.concepts.filter(c => c.subject === (q.subject || ''));
    body = `<div class="qw-body">
      <label class="f">제목</label><input class="inp" data-f="title" value="${esc(q.title)}" placeholder="예) 자유낙하와 역학적 에너지">
      <div class="row"><div><label class="f">과목</label><input class="inp" data-f="subject" list="subjList" value="${esc(q.subject)}" placeholder="예) 물리"></div>
        <div><label class="f">유형</label><select class="inp" data-f="type"><option value="mc" ${q.type === 'mc' ? 'selected' : ''}>객관식</option><option value="short" ${q.type === 'short' ? 'selected' : ''}>단답형</option></select></div></div>
      <label class="f">문항</label><textarea class="inp" data-f="stem" rows="4">${esc(q.stem)}</textarea>
      ${q.imageUrl ? `<div class="img-box">${imgTag(q.imageUrl)}<button data-w="rmimg" title="이미지 삭제">×</button></div>` : ''}
      ${q.type === 'mc' ? `<label class="f">선지 (정답에 체크 · 오른쪽 칸에는 그 선지를 고른 학생의 오개념)</label>
        ${(q.choices || []).map((c, i) => `<div class="ch-row"><input type="radio" name="ans_${w.id}" value="${i + 1}" ${String(q.answer) === String(i + 1) ? 'checked' : ''}>
          <span class="num">${CIRC[i] || i + 1}</span><input class="inp" data-ch="${i}" value="${esc(c)}" placeholder="선지 ${i + 1}">
          <input class="inp mis" data-mis="${i}" value="${esc(q.misconceptions[i] || '')}" placeholder="오개념 (선택)"><button data-delch="${i}" title="선지 삭제">×</button></div>`).join('')}
        <button class="btn" data-w="addch">+ 선지 추가</button>`
      : `<label class="f">정답 (여러 개 인정 시 | 로 구분, 예: 9|9J)</label><input class="inp" data-f="answer" value="${esc(q.answer)}">`}
      <label class="f">해설</label><textarea class="inp" data-f="explanation" rows="2">${esc(q.explanation)}</textarea>
      <label class="f">연결된 개념 노드 (통계 · 개념지도와 연결돼요)</label>
      <div>${q.conceptIds.map(id => `<span class="chip">${esc(conceptName(id) || '?')}<button data-rmc="${id}">×</button></span>`).join('')}
        ${q.newConcepts.map((n, i) => `<span class="chip new" title="저장하면 개념지도에 새 노드로 추가돼요">+ ${esc(n)}<button data-rmn="${i}">×</button></span>`).join('')}</div>
      <div class="row" style="margin-top:6px">
        <select class="inp" data-w="addc"><option value="">${subjNodes.length ? '개념 노드 추가…' : (q.subject ? `'${esc(q.subject)}' 개념지도에 노드가 없어요` : '과목을 먼저 입력하세요')}</option>
          ${subjNodes.filter(c => !q.conceptIds.includes(c.id)).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
        <input class="inp" data-w="newc" placeholder="새 개념 이름 입력 후 Enter">
      </div>
    </div>`;
  }
  el.innerHTML = `
    <div class="qw-bar"><span class="qw-title">${esc(q.title || '새 문제')}</span><span class="qw-state"></span>
      <div class="qw-btns"><button data-w="min" title="최소화">–</button><button data-w="close" title="닫기">×</button></div></div>
    ${body}
    <div class="qw-foot">
      <button class="btn" data-w="mode">${w.mode === 'view' ? '편집' : '미리보기'}</button>
      <button class="btn" data-w="img">이미지</button>
      <span class="grow"></span>
      <select data-w="folder" title="저장할 폴더">${folderOptions(w.folderId)}</select>
      <button class="btn primary" data-w="save">저장</button>
    </div>`;
  setWinState(w);
  bindWin(w);
  fitWin(w);
}
function fitWin(w){
  const lay = $('#winLayer');
  if (!lay || !lay.clientHeight) return;
  const top = parseFloat(w.el.style.top) || 0;
  w.el.style.maxHeight = Math.max(260, lay.clientHeight - top - 8) + 'px';
}
function bindWin(w){
  const el = w.el;
  el.onpointerdown = () => focusWin(w);
  el.onclick = async e => {
    const b = e.target.closest('[data-w]');
    if (b && b.tagName === 'BUTTON') {
      const a = b.dataset.w;
      if (a === 'close') return closeWin(w);
      if (a === 'min') return minimizeWin(w);
      if (a === 'mode') { w.mode = w.mode === 'view' ? 'edit' : 'view'; return drawWin(w); }
      if (a === 'img') return pickImage(w);
      if (a === 'rmimg') { w.q.imageUrl = ''; markDirty(w); return drawWin(w); }
      if (a === 'save') return saveWin(w, $('[data-w=folder]', el).value);
      if (a === 'addch') { w.q.choices.push(''); markDirty(w); return drawWin(w); }
    }
    const dc = e.target.closest('[data-delch]');
    if (dc) {
      const i = Number(dc.dataset.delch);
      w.q.choices.splice(i, 1); w.q.misconceptions.splice(i, 1);
      const a = Number(w.q.answer);
      if (a === i + 1) w.q.answer = ''; else if (a > i + 1) w.q.answer = String(a - 1);
      markDirty(w); return drawWin(w);
    }
    const rc = e.target.closest('[data-rmc]');
    if (rc) { w.q.conceptIds = w.q.conceptIds.filter(x => x !== rc.dataset.rmc); markDirty(w); return drawWin(w); }
    const rn = e.target.closest('[data-rmn]');
    if (rn) { w.q.newConcepts.splice(Number(rn.dataset.rmn), 1); markDirty(w); return drawWin(w); }
  };
  el.oninput = e => {
    const t = e.target;
    if (t.dataset.f) { w.q[t.dataset.f] = t.value; markDirty(w); }
    if (t.dataset.ch) { w.q.choices[Number(t.dataset.ch)] = t.value; markDirty(w); }
    if (t.dataset.mis) { w.q.misconceptions[Number(t.dataset.mis)] = t.value; markDirty(w); }
  };
  el.onchange = e => {
    const t = e.target;
    if (t.name === 'ans_' + w.id) { w.q.answer = t.value; w.q.misconceptions[Number(t.value) - 1] = ''; markDirty(w); drawWin(w); }
    if (t.dataset.f === 'type') {
      if (t.value === 'mc' && !w.q.choices.length) w.q.choices = ['', '', '', ''];
      w.q.answer = ''; drawWin(w);
    }
    if (t.dataset.f === 'subject') drawWin(w);
    if (t.dataset.w === 'addc' && t.value) { w.q.conceptIds.push(t.value); markDirty(w); drawWin(w); }
    if (t.dataset.w === 'folder') w.folderId = t.value;
  };
  el.onkeydown = e => {
    if (e.target.dataset.w === 'newc' && e.key === 'Enter') {
      const v = e.target.value.trim();
      if (!v) return;
      if (!w.q.subject) return toast('과목을 먼저 입력해 주세요', true);
      const hit = S.concepts.find(c => c.subject === w.q.subject && c.name === v);
      if (hit) { if (!w.q.conceptIds.includes(hit.id)) w.q.conceptIds.push(hit.id); }
      else if (!w.q.newConcepts.includes(v)) w.q.newConcepts.push(v);
      markDirty(w); drawWin(w);
      setTimeout(() => { const n = $('[data-w=newc]', w.el); n && n.focus(); }, 0);
    }
  };
  // 창 이동 (상단바 드래그)
  const bar = $('.qw-bar', el);
  bar.onpointerdown = e => {
    if (e.target.closest('button')) return;
    const layer = $('#winLayer').getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const ox = e.clientX - r.left, oy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    el.style.transition = 'none';
    bar.onpointermove = ev => {
      let x = ev.clientX - layer.left - ox, y = ev.clientY - layer.top - oy;
      x = Math.max(0, Math.min(layer.width - r.width, x));
      y = Math.max(0, Math.min(layer.height - 50, y));
      el.style.left = x + 'px'; el.style.top = y + 'px';
    };
    bar.onpointerup = () => { bar.onpointermove = null; el.style.transition = ''; fitWin(w); };
  };
  // 꾹 누르기 → 폴더로 끌어 저장
  const body = $('.qw-body.view', el);
  if (body) body.onpointerdown = e => {
    if (e.button > 0) return;
    const sx = e.clientX, sy = e.clientY;
    let last = e;
    const timer = setTimeout(() => { cleanup(); startLift(w, last); }, 450);
    body.classList.add('pressing');
    const mv = ev => { last = ev; if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 10) { clearTimeout(timer); cleanup(); } };
    const up = () => { clearTimeout(timer); cleanup(); };
    function cleanup(){ window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); body.classList.remove('pressing'); }
    window.addEventListener('pointermove', mv);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
  };
}
function markDirty(w){ w.dirty = true; setWinState(w); }
function startLift(w, e0){
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
  const g = document.createElement('div');
  g.className = 'lift-ghost';
  g.textContent = (w.q.title || '새 문제') + ' → 폴더에 놓기';
  document.body.appendChild(g);
  document.body.classList.add('lifting');
  w.el.classList.add('lifted');
  let hot = null;
  const place = ev => {
    g.style.left = ev.clientX + 'px'; g.style.top = ev.clientY + 'px';
    const t = document.elementFromPoint(ev.clientX, ev.clientY);
    const d = t && t.closest('[data-drop-folder]');
    if (hot && hot !== d) hot.classList.remove('drop-hot');
    hot = d; if (d) d.classList.add('drop-hot');
  };
  place(e0);
  w.el.style.pointerEvents = 'none';
  const mv = ev => { ev.preventDefault(); place(ev); };
  const up = ev => {
    window.removeEventListener('pointermove', mv);
    window.removeEventListener('pointerup', up);
    window.removeEventListener('pointercancel', up);
    g.remove(); document.body.classList.remove('lifting'); w.el.classList.remove('lifted'); w.el.style.pointerEvents = '';
    if (hot) { hot.classList.remove('drop-hot'); saveWin(w, hot.dataset.dropFolder); }
  };
  window.addEventListener('pointermove', mv, {passive:false});
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
}
async function saveWin(w, folderId){
  const q = w.q;
  if (!q.stem.trim()) return toast('문항 내용을 입력해 주세요', true);
  if (q.type === 'mc' && (q.choices || []).filter(c => String(c).trim()).length < 2) return toast('선지를 2개 이상 입력해 주세요', true);
  const r = await call('saveQuestion', q, folderId);
  applyBank(r.bank); S.concepts = r.concepts; updateSubjList();
  w.q = r.question; w.q.newConcepts = []; w.folderId = r.question.folderId || '';
  w.dirty = false; w.saved = true;
  drawWin(w);
  if ($('#exMain')) renderExplorer();
  toast(`'${folderName(w.folderId)}'에 저장했어요`);
  if (r.analysisNote) toast(r.analysisNote, true);
}
async function closeWin(w){
  if (w.dirty) {
    const ok = await confirmBox('문제가 저장되지 않습니다.\n그래도 창을 닫을까요?', '닫기', true);
    if (!ok) return;
  }
  w.el.classList.add('opening');
  setTimeout(() => { w.el.remove(); S.wins.delete(w.id); renderTaskbar(); }, 220);
}
function minimizeWin(w){
  const lay = $('#winLayer').getBoundingClientRect();
  const r = w.el.getBoundingClientRect();
  const nMin = [...S.wins.values()].filter(x => x.min).length;
  const tx = 110 + nMin * 150 - (r.left - lay.left) - r.width / 2;
  const ty = lay.height + 23 - (r.top - lay.top) - r.height / 2;
  w.el.style.setProperty('--mx', tx + 'px');
  w.el.style.setProperty('--my', ty + 'px');
  w.el.style.transformOrigin = 'center';
  w.el.classList.add('minimizing');
  w.min = true;
  setTimeout(() => { if (w.min) w.el.style.display = 'none'; renderTaskbar(); }, 340);
}
function restoreWin(w){
  w.min = false;
  w.el.style.display = '';
  void w.el.offsetWidth;
  w.el.classList.remove('minimizing');
  focusWin(w);
  renderTaskbar();
}
function renderTaskbar(){
  const tb = $('#taskbar');
  if (!tb) return;
  const mins = [...S.wins.values()].filter(w => w.min);
  tb.innerHTML = `<span class="tb-label">${mins.length ? '최소화된 문제' : '최소화(–)한 문제 창이 여기에 모여요'}</span>` +
    mins.map(w => `<div class="tb-chip" data-wid="${w.id}"><b style="color:var(--blue)">Q</b><span>${esc(w.q.title || '새 문제')}</span></div>`).join('');
  $$('.tb-chip', tb).forEach(c => c.onclick = () => restoreWin(S.wins.get(c.dataset.wid)));
}
function pickImage(w){
  const fi = $('#fileInput');
  fi.value = '';
  fi.onchange = async () => {
    const f = fi.files[0];
    if (!f) return;
    try {
      const dataUrl = await resizeImage(f, 1400);
      const r = await call('uploadImage', dataUrl, f.name);
      w.q.imageUrl = r.url; markDirty(w); drawWin(w);
      toast('이미지를 추가했어요');
    } catch(e){}
  };
  fi.click();
}
function resizeImage(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .88));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function sendChat(){
  const inp = $('#chatIn');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  S.chatLog.push({who:'me', text});
  const typing = {who:'ai typing', text:S.aiOn ? '문제를 만드는 중…' : '서식에 맞춰 정리하는 중…'};
  S.chatLog.push(typing); renderChat();
  try {
    if (S.aiOn) {
      S.chat.push({role:'user', content:text});
      const r = await call('aiChat', S.chat, S.mkSubject);
      S.chat.push({role:'assistant', content:r.reply + (r.question ? '\n[문제] ' + JSON.stringify(r.question) : '')});
      S.chatLog.splice(S.chatLog.indexOf(typing), 1);
      S.chatLog.push({who:'ai', text:r.reply || '문제를 만들었어요.'});
      if (r.question) { openQWin(r.question); S.chatLog.push({who:'sys', text:'왼쪽에 문제 창을 띄웠어요'}); }
    } else {
      const r = await call('aiFormat', text, S.mkSubject);
      S.chatLog.splice(S.chatLog.indexOf(typing), 1);
      S.chatLog.push({who:'ai', text:(r.note ? r.note + '\n' : '') + '문제 서식으로 정리했어요. 왼쪽 창에서 확인하세요.'});
      const w = openQWin(r.question);
      renderChat();
      if (w) askImage(w);
    }
  } catch(e) {
    const i = S.chatLog.indexOf(typing); if (i >= 0) S.chatLog.splice(i, 1);
    S.chatLog.push({who:'sys', text:'오류: ' + ((e && e.message) || e).toString().replace(/^Error:\s*/, '')});
  }
  renderChat();
}

function currentSemesterId(){

  return s ? s.id : (S.semesters[0] || {}).id;

function countLessons(semId, slots){
  const sem = S.semesters.find(s => s.id === semId);
  if (!sem || !slots.length) return 0;
  const hs = new Set(S.holidays.map(h => h.date));
  let n = 0;
  const d = new Date(sem.start + 'T00:00:00Z'), end = new Date(sem.end + 'T00:00:00Z');
  while (d <= end) {
    if (!hs.has(d.toISOString().slice(0, 10))) n += slots.filter(s => Number(s.day) === d.getUTCDay()).length;
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return n;

function previewQ(q){ if (q) modal({title:q.title, wide:true, body:renderQ(q, {answer:true, mis:true, concepts:true, noTitle:true})}); }
function renderTree(){
  const kw = ($('#treeSearch').value || '').trim().toLowerCase();
  const used = new Set(lessonState.ids);
  const qItem = q => `<div class="tree-q ${used.has(q.id) ? 'used' : ''}" draggable="true" data-qid="${q.id}">
      <span class="qtype ${q.type}">${q.type === 'mc' ? '객' : '단'}</span><span class="tt" title="${esc(q.stem)}">${esc(q.title)}</span>
      <button class="add" data-add="${q.id}" title="추가">+</button></div>`;
  let html;
  if (kw) {
    const qs = S.questions.filter(q => (q.title + ' ' + q.stem).toLowerCase().includes(kw));
    html = qs.length ? qs.map(qItem).join('') : '<div class="empty">검색 결과가 없어요</div>';
  } else {
    const walk = (pid) => S.folders.filter(f => (f.parentId || '') === pid).sort((a, b) => a.name.localeCompare(b.name, 'ko')).map(f => {
      const open = lessonState.open.has(f.id);
      const n = countIn(f.id);
      return `<div class="tree-f ${open ? 'open' : ''}" data-tf="${f.id}"><span class="arr">▶</span>${IC.folder.replace('<svg', '<svg width="18" height="18"')}${esc(f.name)} <small style="color:#999">${n.q}</small></div>
        ${open ? `<div class="tree-kids">${walk(f.id)}${S.questions.filter(q => q.folderId === f.id).map(qItem).join('')}</div>` : ''}`;
    }).join('');
    html = walk('') + S.questions.filter(q => !q.folderId).map(qItem).join('');
    if (!S.questions.length) html = '<div class="empty">문제은행이 비어 있어요.</div>';
  }
  $('#tree').innerHTML = html;
  $$('[data-tf]').forEach(f => f.onclick = () => { const id = f.dataset.tf; lessonState.open.has(id) ? lessonState.open.delete(id) : lessonState.open.add(id); renderTree(); });
  $$('[data-add]').forEach(b => b.onclick = () => { if (!lessonState.ids.includes(b.dataset.add)) { lessonState.ids.push(b.dataset.add); lessonChanged(); } });
  $$('.tree-q').forEach(q => q.ondblclick = () => previewQ(S.questions.find(x => x.id === q.dataset.qid)));
}
function bindLessonDnD(){
  const drop = $('#lsDrop'), tree = $('#tree');
  tree.addEventListener('dragstart', e => { const t = e.target.closest('.tree-q'); if (t) e.dataTransfer.setData('text/plain', 'add:' + t.dataset.qid); });
  drop.addEventListener('dragstart', e => { const t = e.target.closest('.lq'); if (t) e.dataTransfer.setData('text/plain', 'mv:' + t.dataset.idx); });
  drop.addEventListener('dragover', e => {
    e.preventDefault(); drop.classList.add('hot');
    $$('.lq', drop).forEach(x => x.classList.toggle('drag-over', x === e.target.closest('.lq')));
  });
  drop.addEventListener('dragleave', e => { if (!drop.contains(e.relatedTarget)) { drop.classList.remove('hot'); $$('.lq', drop).forEach(x => x.classList.remove('drag-over')); } });
  drop.addEventListener('drop', e => {
    e.preventDefault(); drop.classList.remove('hot');
    const raw = e.dataTransfer.getData('text/plain');
    const over = e.target.closest('.lq');
    let pos = over ? Number(over.dataset.idx) : lessonState.ids.length;
    const ids = lessonState.ids;
    if (raw.startsWith('add:')) {
      const id = raw.slice(4);
      if (ids.includes(id)) return toast('이미 추가된 문제예요');
      ids.splice(pos, 0, id);
    } else if (raw.startsWith('mv:')) {
      const from = Number(raw.slice(3));
      const [it] = ids.splice(from, 1);
      if (from < pos) pos--;
      ids.splice(over ? pos : ids.length, 0, it);
    } else return;
    lessonChanged();
  });
}
function lessonChanged(){

async function loadMap(first){

function drawMap(){
  const stage = $('#cstage');

  const maxX = Math.max(1500, ...d.nodes.map(n => n.x + 200)), maxY = Math.max(900, ...d.nodes.map(n => n.y + 160));

    const el = document.createElement('div');
    el.className = 'cnode' + (CM.sel === n.id ? ' sel' : '');

    el.innerHTML = `<div class="cn-float" style="animation-delay:${-(i * 0.73) % 5}s"><div class="cn-tile ${lvClass(n.stat.rate, n.stat.n)}"><span>${n.stat.n ? pctStr(n.stat.rate) : '–'}</span></div>

    stage.appendChild(el);

function drawLinks(temp){

    const a = pos[l.from], b = pos[l.to];
    if (!a || !b) return '';
    return `<g data-lid="${l.id}"><line class="hit" x1="${a.x}" y1="${a.y - 4}" x2="${b.x}" y2="${b.y - 4}"/><line class="vis" x1="${a.x}" y1="${a.y - 4}" x2="${b.x}" y2="${b.y - 4}"/></g>`;
  }).join('') + (temp ? `<line class="temp" x1="${temp.x1}" y1="${temp.y1}" x2="${temp.x2}" y2="${temp.y2}"/>` : '');
  $$('g[data-lid]', svg).forEach(g => g.onclick = async () => {
    const l = CM.data.links.find(x => x.id === g.dataset.lid);
    const na = CM.data.nodes.find(n => n.id === l.from), nb = CM.data.nodes.find(n => n.id === l.to);
    if (!await confirmBox(`'${na.name}' — '${nb.name}' 연결을 삭제할까요?`, '삭제', true)) return;
    const r = await call('deleteLink', l.id, CM.subject); CM.data.links = r.links; drawLinks();

}
function stagePoint(e){ const r = $('#cstage').getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function bindNode(el, n){
  const tile = $('.cn-tile', el), handle = $('.cn-handle', el);
  const linkDrag = (e) => {
    e.stopPropagation(); e.preventDefault();
    el.classList.add('link-src');
    const mv = ev => { const p = stagePoint(ev); drawLinks({x1:n.x, y1:n.y - 4, x2:p.x, y2:p.y}); };
    const up = async ev => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      el.classList.remove('link-src');
      const t = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = t && t.closest('.cnode');
      drawLinks();
      if (target && target.dataset.id && target.dataset.id !== n.id) {
        const r = await call('addLink', CM.subject, n.id, target.dataset.id);
        CM.data.links = r.links; drawLinks(); toast('개념을 연결했어요');
      }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  };
  handle.onpointerdown = linkDrag;
  tile.onpointerdown = e => {
    if (CM.linkMode) return linkDrag(e);
    e.preventDefault();
    const s = stagePoint(e), ox = n.x, oy = n.y;
    let moved = false;
    const mv = ev => {
      const p = stagePoint(ev);
      if (!moved && Math.hypot(p.x - s.x, p.y - s.y) < 4) return;
      moved = true;
      n.x = Math.max(50, ox + p.x - s.x); n.y = Math.max(50, oy + p.y - s.y);
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px';
      drawLinks();
    };
    const up = () => {
      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      if (moved) { clearTimeout(CM.posT); CM.posT = setTimeout(() => call('savePositions', CM.data.nodes.map(x => ({id:x.id, x:x.x, y:x.y}))).catch(() => {}), 700); }
      else { CM.sel = CM.sel === n.id ? null : n.id; $$('.cnode').forEach(x => x.classList.toggle('sel', x.dataset.id === CM.sel)); drawSide(); }
    };
    window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
  };
}
function drawSide(){
  const side = $('#cside');
  if (!side) return;
  const d = CM.data;
  const n = d.nodes.find(x => x.id === CM.sel);
  if (!n) {
    const withData = d.nodes.filter(x => x.stat.n);
    const weak = withData.slice().sort((a, b) => a.stat.rate - b.stat.rate).slice(0, 5);
    const tot = withData.reduce((a, x) => a + x.stat.n, 0), cor = withData.reduce((a, x) => a + x.stat.c, 0);
    side.innerHTML = `<h3>${esc(d.subject)} 요약</h3>
      <div style="color:var(--sub);font-size:13px">노드 ${d.nodes.length}개 · 연결 ${d.links.length}개 · 응답 ${tot}건</div>
      <div class="side-sec"><h4>전체 이해도</h4><div class="big-pct" style="color:${lvColor(tot ? cor / tot : null, tot)}">${tot ? pctStr(cor / tot) : '-'}</div>
        <div class="gauge"><b style="width:${tot ? cor / tot * 100 : 0}%;background:${lvColor(tot ? cor / tot : null, tot)}"></b></div></div>
      <div class="side-sec"><h4>보충이 필요한 개념</h4>${weak.length ? weak.map(x => `<div class="mis-item" style="cursor:pointer" data-pick="${x.id}"><b>${esc(x.name)}</b> <span style="float:right;color:${lvColor(x.stat.rate, 1)}">${pctStr(x.stat.rate)}</span>
        <div class="gauge"><b style="width:${x.stat.rate * 100}%;background:${lvColor(x.stat.rate, 1)}"></b></div></div>`).join('') : '<div style="color:#9aa0ac;font-size:13px">아직 학생 응답이 없어요. 문제에 개념 노드를 연결하고 수업에서 사용하면 통계가 쌓여요.</div>'}</div>
      <div class="side-sec" style="color:var(--sub);font-size:12px;line-height:1.6">노드를 누르면 해당 개념의 이해도와 주요 오개념을 볼 수 있어요.</div>`;
    $$('[data-pick]', side).forEach(x => x.onclick = () => { CM.sel = x.dataset.pick; drawMap(); });
    return;
  }
  const s = n.stat, col = lvColor(s.rate, s.n);
  const maxMis = Math.max(1, ...s.mis.map(m => m.count));
  side.innerHTML = `<input class="inp" id="nName" value="${esc(n.name)}" style="font-size:17px;font-weight:700">
    <textarea class="inp" id="nDesc" rows="2" placeholder="개념 설명 (선택)" style="margin-top:6px">${esc(n.desc || '')}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px"><button class="btn primary" id="nSave">저장</button><button class="btn danger" id="nDel">노드 삭제</button></div>
    <div class="side-sec"><h4>이해도 (정답률)</h4><div class="big-pct" style="color:${col}">${s.n ? pctStr(s.rate) : '-'}</div>
      <div class="gauge"><b style="width:${s.n ? s.rate * 100 : 0}%;background:${col}"></b></div>
      <div style="font-size:12px;color:var(--sub)">응답 ${s.n}건 · 정답 ${s.c}건 · 오답 ${s.n - s.c}건</div></div>
    <div class="side-sec"><h4>주요 오개념</h4>${s.mis.length ? s.mis.map(m => `<div class="mis-item"><div style="display:flex;gap:8px"><span style="flex:1">${esc(m.text)}</span><b>${m.count}명</b></div>
      <div class="bar"><b style="width:${m.count / maxMis * 100}%"></b></div></div>`).join('') : '<div style="color:#9aa0ac;font-size:13px">기록된 오개념이 없어요.<br>(문제의 오답 선지에 오개념을 적어 두면 여기에 모여요)</div>'}</div>
    <div class="side-sec"><h4>연결된 문제 (${s.qs.length})</h4>${s.qs.length ? s.qs.map(q => `<div style="display:flex;gap:8px;font-size:13px;padding:4px 0"><span style="flex:1">${esc(q.title)}</span><span style="color:${lvColor(q.rate, q.n)}">${q.n ? pctStr(q.rate) + ` (${q.n})` : '응답 없음'}</span></div>`).join('') : '<div style="color:#9aa0ac;font-size:13px">문제은행의 문제 편집 화면에서 이 개념을 연결할 수 있어요.</div>'}</div>`;
  $('#nSave').onclick = async () => { applyMap(await call('saveNode', {id:n.id, subject:CM.subject, name:$('#nName').value, desc:$('#nDesc').value, x:n.x, y:n.y, classId:CM.classId})); toast('저장했어요'); };
  $('#nDel').onclick = async () => {
    if (!await confirmBox(`'${n.name}' 노드와 연결선을 삭제할까요?`, '삭제', true)) return;
    CM.sel = null; await call('deleteNode', n.id, CM.subject); loadMap();
  };
}
